<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloss Clean - Zakazivanje</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #06080e; color: #ffffff; padding: 30px 15px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .logo-ring { width: 110px; height: 110px; border-radius: 50%; border: 2px solid #2563eb; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(37, 99, 235, 0.3); margin-bottom: 15px; overflow: hidden; background: #000; }
        .logo-ring img { width: 100%; height: 100%; object-fit: cover; }
        
        .brand-title { font-size: 32px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #ffffff; }
        .brand-title span { color: #2563eb; }

        .main-card { max-width: 580px; margin: 0 auto; background-color: #0d121f; border: 1px solid #1a233a; border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .section-title { font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #3b82f6; text-transform: uppercase; margin-top: 20px; margin-bottom: 15px; }
        .section-title:first-child { margin-top: 0; }

        /* Usluge stil */
        .usluga-card { display: flex; align-items: center; background-color: #111827; border: 1px solid #1e293b; padding: 16px 20px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s ease; }
        .usluga-card:hover { border-color: #2563eb; background-color: #162032; }
        .usluga-card input[type="checkbox"] { width: 20px; height: 20px; margin-right: 15px; accent-color: #2563eb; cursor: pointer; }
        .usluga-text { font-size: 15px; font-weight: 600; color: #f3f4f6; }

        label.field-label { display: block; margin-top: 15px; font-size: 13px; font-weight: 600; color: #9ca3af; margin-bottom: 6px; }
        input[type="text"], input[type="date"], textarea, select { width: 100%; padding: 14px 16px; background-color: #111827; color: #ffffff; border: 1px solid #1e293b; border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.2s; }
        input:focus, textarea:focus, select:focus { border-color: #2563eb; }

        .termini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .termin { padding: 12px; background-color: #111827; border: 1px solid #1e293b; cursor: pointer; border-radius: 8px; text-align: center; font-size: 14px; font-weight: 600; color: #e5e7eb; transition: all 0.2s; }
        .termin:hover { border-color: #2563eb; }
        .termin.selekcija { background-color: #2563eb; border-color: #3b82f6; color: #ffffff; }
        .termin.zauzet { background-color: #1f2937; color: #4b5563; text-decoration: line-through; cursor: not-allowed; border-color: transparent; }

        button.btn-submit { width: 100%; padding: 16px; margin-top: 25px; background-color: #2563eb; color: #ffffff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background-color 0.2s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        button.btn-submit:hover { background-color: #1d4ed8; }

        .divider { height: 1px; background-color: #1a233a; margin: 30px 0; }

        .recenzija-card { background: #111827; padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #1e293b; }
        .recenzija-header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 6px; font-size: 14px; }
        .zvezdice { color: #f59e0b; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-ring">
            <img src="/static/logo.png" alt="Gloss Clean Logo">
        </div>
        <div class="brand-title">GLOSS <span>CLEAN</span></div>
    </div>

    <div class="main-card">
        <div class="section-title">1. Izaberite uslugu</div>
        
        <label class="usluga-card">
            <input type="checkbox" name="usluga" value="Ugaona garnitura">
            <span class="usluga-text">Ugaona garnitura</span>
        </label>

        <label class="usluga-card">
            <input type="checkbox" name="usluga" value="Stolica">
            <span class="usluga-text">Stolica</span>
        </label>

        <label class="usluga-card">
            <input type="checkbox" name="usluga" value="Tepih">
            <span class="usluga-text">Tepih</span>
        </label>

        <label class="usluga-card">
            <input type="checkbox" name="usluga" value="Dvosed">
            <span class="usluga-text">Dvosed</span>
        </label>

        <label class="usluga-card">
            <input type="checkbox" name="usluga" value="Trosed">
            <span class="usluga-text">Trosed</span>
        </label>

        <label class="usluga-card">
            <input type="checkbox" name="usluga" value="Bračni krevet">
            <span class="usluga-text">Bračni krevet</span>
        </label>

        <label class="usluga-card">
            <input type="checkbox" name="usluga" value="Ostalo">
            <span class="usluga-text">Ostalo</span>
        </label>

        <div class="divider"></div>

        <div class="section-title">2. Podaci za zakazivanje</div>

        <label class="field-label">Ime i prezime:</label>
        <input type="text" id="ime" placeholder="Vaše ime i prezime">

        <label class="field-label">Broj telefona:</label>
        <input type="text" id="telefon" placeholder="06x xxx xxxx">

        <label class="field-label">Izaberite datum:</label>
        <input type="date" id="datum" onchange="ucitajTermine()">

        <label class="field-label">Izaberite termin:</label>
        <div class="termini" id="termini-container">
            <p style="color: #6b7280; grid-column: span 3; text-align: center; padding: 10px; font-size: 13px;">Prvo izaberite datum</p>
        </div>

        <button class="btn-submit" onclick="rezervisi()">Potvrdi rezervaciju</button>

        <div class="divider"></div>

        <div class="section-title">Utisci klijenata</div>
        <div id="recenzije-lista">
            <p style="color: #6b7280; text-align: center; font-size: 13px;">Učitavanje recenzija...</p>
        </div>

        <div class="section-title" style="margin-top: 25px;">Ostavite recenziju</div>
        <input type="text" id="rec-ime" placeholder="Vaše ime">
        
        <label class="field-label">Ocena:</label>
        <select id="rec-ocena">
            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
            <option value="4">⭐⭐⭐⭐ (4/5)</option>
            <option value="3">⭐⭐⭐ (3/5)</option>
            <option value="2">⭐⭐ (2/5)</option>
            <option value="1">⭐ (1/5)</option>
        </select>
        
        <label class="field-label">Komentar:</label>
        <textarea id="rec-komentar" rows="3" placeholder="Vaš utisak..."></textarea>
        
        <button class="btn-submit" style="background-color: #1f2937; box-shadow: none;" onclick="ostaviRecenziju()">Pošalji recenziju</button>
    </div>

<script>
    let izabraniTermin = null;
    const sviTermini = ["09:00", "10:30", "12:00", "13:30", "15:00", "16:30", "18:00"];

    document.getElementById('datum').min = new Date().toISOString().split('T')[0];

    async function ucitajTermine() {
        const datum = document.getElementById('datum').value;
        const container = document.getElementById('termini-container');
        container.innerHTML = "";
        izabraniTermin = null;

        if (!datum) return;

        const res = await fetch(`/zauzeti-termini?datum=${datum}`);
        const zauzeti = await res.json();

        sviTermini.forEach(t => {
            const div = document.createElement('div');
            div.className = 'termin';
            div.innerText = t;

            if (zauzeti.includes(t)) {
                div.classList.add('zauzet');
            } else {
                div.onclick = () => {
                    document.querySelectorAll('.termin').forEach(el => el.classList.remove('selekcija'));
                    div.classList.add('selekcija');
                    izabraniTermin = t;
                };
            }
            container.appendChild(div);
        });
    }

    async function rezervisi() {
        const ime = document.getElementById('ime').value;
        const telefon = document.getElementById('telefon').value;
        const datum = document.getElementById('datum').value;

        const izabraneUsluge = [];
        document.querySelectorAll('input[name="usluga"]:checked').forEach(cb => {
            izabraneUsluge.push(cb.value);
        });

        if (izabraneUsluge.length === 0) {
            alert("Molimo izaberite bar jednu uslugu.");
            return;
        }

        if (!ime || !telefon || !datum || !izabraniTermin) {
            alert("Popunite sva polja i izaberite termin.");
            return;
        }

        const uslugaText = izabraneUsluge.join(", ");

        const res = await fetch('/rezervisi', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ime, telefon, usluga: uslugaText, datum, vreme: izabraniTermin })
        });

        const data = await res.json();
        alert(data.poruka);
        if (res.ok) ucitajTermine();
    }

    async function ucitajRecenzije() {
        const res = await fetch('/recenzije');
        const recenzije = await res.json();
        const container = document.getElementById('recenzije-lista');
        container.innerHTML = "";

        if (recenzije.length === 0) {
            container.innerHTML = '<p style="color: #6b7280; text-align: center; font-size: 13px;">Nema recenzija. Budi prvi!</p>';
            return;
        }

        recenzije.forEach(r => {
            const div = document.createElement('div');
            div.className = 'recenzija-card';
            div.innerHTML = `
                <div class="recenzija-header">
                    <span>${r.ime}</span>
                    <span class="zvezdice">${'⭐'.repeat(r.ocena)}</span>
                </div>
                <div style="color: #d1d5db; font-size: 14px;">"${r.komentar}"</div>
            `;
            container.appendChild(div);
        });
    }

    async function ostaviRecenziju() {
        const ime = document.getElementById('rec-ime').value;
        const ocena = document.getElementById('rec-ocena').value;
        const komentar = document.getElementById('rec-komentar').value;

        if (!ime || !komentar) {
            alert("Unesite ime i komentar.");
            return;
        }

        const res = await fetch('/ostavi-recenziju', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ime, ocena, komentar })
        });

        const data = await res.json();
        alert(data.poruka);
        if (res.ok) {
            document.getElementById('rec-ime').value = "";
            document.getElementById('rec-komentar').value = "";
            ucitajRecenzije();
        }
    }

    ucitajRecenzije();
</script>

</body>
</html>
